<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Usuários</title>
  <link rel="stylesheet" href="stylo.css">
</head>
<body>
  <main>
    <h1>Gestão de Usuários</h1>

    <div id="message" class="message" role="status" hidden></div>

    <section class="card">
      <h2 id="form-title">Novo usuário</h2>

      <!-- novalidate: quem valida é a API; o frontend só exibe a mensagem que ela devolve -->
       
      <form id="form" novalidate>
        <input type="hidden" id="id">
        <label>Nome <input type="text" id="name" autocomplete="off"></label>
        <label>E-mail <input type="email" id="email" autocomplete="off"></label>
        <label>Login <input type="text" id="login" autocomplete="off"></label>
        <label>Senha <input type="password" id="password" autocomplete="new-password"></label>
        <label class="check"><input type="checkbox" id="active" checked> Ativo</label>
        <div class="actions">
          <button type="submit">Salvar</button>
          <button type="button" id="cancel" class="secondary" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Usuários <span id="loading" hidden>Carregando…</span></h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Login</th><th>Status</th><th>Ações</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
